<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초코바나나 계산기 🍌</title>
    <style>
        :root {
            --banana-yellow: #fff5a5;
            --choco-brown: #4e342e;
            --dark-choco: #2d1b18;
            --accent-yellow: #ffeb3b;
            --soft-shadow: 0 8px 16px rgba(0, 0, 0, 0.35);
        }

        body {
            margin: 0; padding: 20px; font-family: 'Nanum Gothic', sans-serif;
            background-color: var(--choco-brown);
            background-image: radial-gradient(var(--dark-choco) 20%, transparent 20%), radial-gradient(var(--dark-choco) 20%, transparent 20%);
            background-position: 0 0, 20px 20px; background-size: 40px 40px; background-attachment: fixed;
            color: #333; padding-bottom: 240px;
        }

        /* 공통 카드 스타일 */
        .card, .header, .modal-content {
            background: #fffdf0; border-radius: 20px; box-shadow: var(--soft-shadow);
        }

        .header { background: var(--banana-yellow); padding: 20px; text-align: center; margin-bottom: 25px; position: relative; }
        .settings-btn { position: absolute; top: 15px; right: 15px; cursor: pointer; font-size: 20px; }
        
        .card { padding: 20px; margin-bottom: 20px; }
        .card h3 { color: var(--choco-brown); margin: 0 0 15px 0; border-left: 5px solid var(--choco-brown); padding-left: 10px; font-size: 14px; }

        input { width: 100%; padding: 14px; margin: 6px 0; border: 2px solid var(--banana-yellow); border-radius: 12px; box-sizing: border-box; font-size: 16px; transition: border-color 0.3s; }
        input:focus { outline: none; border-color: var(--choco-brown); }
        
        button { cursor: pointer; border: none; font-weight: bold; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }

        .add-btn { width: 100%; padding: 16px; background: var(--accent-yellow); border-radius: 40px; font-size: 18px; box-shadow: var(--soft-shadow); margin-top: 15px; }

        /* 커스텀 모달 스타일 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 2000;
            backdrop-filter: blur(3px);
        }
        .modal-content {
            width: 85%; max-width: 320px; padding: 25px; text-align: center;
            border: 4px solid var(--banana-yellow);
        }
        .modal-title { color: var(--choco-brown); font-size: 18px; margin-bottom: 20px; }
        .modal-buttons { display: flex; flex-direction: column; gap: 10px; }
        .modal-btn { padding: 15px; border-radius: 15px; font-size: 16px; box-shadow: 0 4px 0 rgba(0,0,0,0.1); }
        .btn-consumable { background: #e8f5e9; color: #2e7d32; border: 2px solid #2e7d32; }
        .btn-general { background: #e3f2fd; color: #1565c0; border: 2px solid #1565c0; }

        /* 장바구니 리스트 */
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px dashed #ddd; }
        .qty-control { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .qty-btn { width: 28px; height: 28px; border-radius: 8px; border: 1px solid #ddd; background: white; }
        
        .type-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }
        .tag-consumable { background: #e8f5e9; color: #2e7d32; }
        .tag-general { background: #e3f2fd; color: #1565c0; }

        /* 하단 바 */
        .total-bar {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--dark-choco);
            color: white; padding: 18px 20px; border-radius: 30px 30px 0 0;
            box-shadow: 0 -8px 24px rgba(0,0,0,0.45); border-top: 5px solid var(--banana-yellow); z-index: 1000;
        }
        .sub-totals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; font-size: 12px; color: #bbb; }
        .main-total { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.08); padding: 12px 18px; border-radius: 18px; }
        .tax-free-banner { background: #fffde7; color: #333; margin-top: 12px; padding: 10px; border-radius: 12px; font-size: 13px; text-align: center; }
    </style>
</head>
<body>

    <div id="taxModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">🍌 세율을 선택해 주세요</div>
            <div class="modal-buttons">
                <button class="modal-btn btn-consumable" onclick="selectTax(0.08, '소모품')">소모품 (8%)</button>
                <button class="modal-btn btn-general" onclick="selectTax(0.10, '일반')">일반 물품 (10%)</button>
                <button style="margin-top:10px; background:none; color:#999;" onclick="closeModal()">취소</button>
            </div>
        </div>
    </div>

    <div class="header">
        <span class="settings-btn" onclick="openSettings()">⚙️</span>
        <h2 style="margin:0">쇼핑 목록 계산기</h2>
        <small>Don Quijote JP 🍌🍫</small>
    </div>

    <div class="card">
        <h3>ITEM INPUT</h3>
        <input type="text" id="name" placeholder="상품명">
        <input type="number" id="prePrice" placeholder="세전 가격 (엔)" inputmode="numeric">
        <input type="number" id="postPrice" placeholder="세후 가격 (엔)" inputmode="numeric">
        <input type="number" id="qty" value="1" placeholder="개수" inputmode="numeric">
        <button class="add-btn" onclick="handleAddItem()">~~ 'u' ~~ 담기</button>
    </div>

    <div class="card">
        <h3>🛒 장바구니</h3>
        <div id="itemList"></div>
        <button onclick="clearCart()" style="background:none; border:none; color:#999; margin-top:20px; width:100%; font-size:12px;">전체 비우기</button>
    </div>

    <div class="total-bar">
        <div class="sub-totals">
            <div>소모품(8%): <span id="sumConsumable" style="color:white; font-weight:bold;">0</span> ¥</div>
            <div style="text-align:right;">일반(10%): <span id="sumGeneral" style="color:white; font-weight:bold;">0</span> ¥</div>
        </div>
        <div class="main-total">
            <div style="font-size:13px; color:var(--banana-yellow);">최종 결제 금액</div>
            <div id="finalTotal" style="font-size:24px; font-weight:bold; color:var(--accent-yellow);">0 ¥</div>
        </div>
        <div id="msg" class="tax-free-banner">카테고리별 5,000엔 이상 시 면세 가능</div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('chocoCart')) || [];
        let sheetUrl = localStorage.getItem('sheetUrl') || "";
        let pendingItem = null; // 팝업 대기 중인 임시 데이터

        function handleAddItem() {
            let pre = document.getElementById('prePrice').value;
            let post = document.getElementById('postPrice').value;
            const name = document.getElementById('name').value || "상품";
            const qty = Number(document.getElementById('qty').value);

            if (!pre && !post) return alert("가격을 입력해주세요!");

            // 1. 둘 다 입력한 경우 -> 바로 담기
            if (pre && post) {
                const finalPre = Number(pre);
                const finalPost = Number(post);
                const rate = (finalPost - finalPre) / finalPre;
                const finalType = rate > 0.09 ? "일반" : "소모품";
                executeAdd(name, finalPre, finalPost, qty, finalType);
            } 
            // 2. 하나만 입력한 경우 -> 커스텀 모달 열기
            else {
                pendingItem = { name, pre: pre ? Number(pre) : null, post: post ? Number(post) : null, qty };
                document.getElementById('taxModal').style.display = 'flex';
            }
        }

        function selectTax(rate, type) {
            let finalPre, finalPost;
            if (pendingItem.pre) {
                finalPre = pendingItem.pre;
                finalPost = Math.floor(finalPre * (1 + rate));
            } else {
                finalPost = pendingItem.post;
                finalPre = Math.ceil(finalPost / (1 + rate));
            }
            executeAdd(pendingItem.name, finalPre, finalPost, pendingItem.qty, type);
            closeModal();
        }

        function closeModal() {
            document.getElementById('taxModal').style.display = 'none';
            pendingItem = null;
        }

        async function executeAdd(name, pre, post, qty, type) {
            const newItem = { name, pre, post, qty, type };
            cart.push(newItem);
            if(sheetUrl) fetch(sheetUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify(newItem) });
            saveAndRender();
            // 초기화
            document.getElementById('name').value = '';
            document.getElementById('prePrice').value = '';
            document.getElementById('postPrice').value = '';
            document.getElementById('qty').value = '1';
        }

        function changeQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty < 1) cart[index].qty = 1;
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('chocoCart', JSON.stringify(cart));
            render();
        }

        function render() {
            const list = document.getElementById('itemList');
            list.innerHTML = '';
            let sumC = 0, sumG = 0, taxC = 0, taxG = 0;

            cart.forEach((item, i) => {
                const itemTotalPre = item.pre * item.qty;
                const itemTotalPost = item.post * item.qty;
                if(item.type === "소모품") { sumC += itemTotalPre; taxC += itemTotalPost; }
                else { sumG += itemTotalPre; taxG += itemTotalPost; }

                list.innerHTML += `
                    <div class="item-row">
                        <div>
                            <b>${item.name}</b><span class="type-tag ${item.type === "소모품" ? "tag-consumable" : "tag-general"}">${item.type}</span>
                            <div class="qty-control">
                                <button class="qty-btn" onclick="changeQty(${i}, -1)">-</button>
                                <span style="font-size:14px; font-weight:bold;">${item.qty}</span>
                                <button class="qty-btn" onclick="changeQty(${i}, 1)">+</button>
                            </div>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-size:18px; font-weight:bold;">${itemTotalPost.toLocaleString()}¥</div>
                            <div style="color:#ff4444; font-size:11px; margin-top:8px; cursor:pointer;" onclick="remove(${i})">삭제</div>
                        </div>
                    </div>`;
            });

            const isCFree = sumC >= 5000, isGFree = sumG >= 5000;
            const finalC = isCFree ? sumC : taxC, finalG = isGFree ? sumG : taxG;

            document.getElementById('sumConsumable').innerText = finalC.toLocaleString();
            document.getElementById('sumGeneral').innerText = finalG.toLocaleString();
            document.getElementById('finalTotal').innerText = (finalC + finalG).toLocaleString() + " ¥";
            
            const isAnyFree = isCFree || isGFree;
            document.getElementById('msg').innerText = (isCFree && isGFree) ? "🎉 전 품목 면세 적용 완료!" : (isAnyFree ? "💡 일부 면세 적용 (5,000엔↑ 항목)" : "카테고리별 5,000엔 이상 시 면세 가능");
        }

        function remove(i) { cart.splice(i, 1); saveAndRender(); }
        function clearCart() { if(confirm("모든 목록을 삭제할까요?")) { cart = []; saveAndRender(); } }
        function openSettings() {
            const url = prompt("구글 Apps Script 배포 URL:", sheetUrl);
            if (url !== null) { localStorage.setItem('sheetUrl', url); sheetUrl = url; }
        }

        render();
    </script>
</body>
</html>
