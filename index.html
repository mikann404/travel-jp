<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초코바나나 계산기 🍌</title>
    <style>
        :root {
            --banana-yellow: #fff5a5;
            --choco-brown: #4e342e;
            --dark-choco: #2d1b18;
            --accent-yellow: #ffeb3b;
            --soft-shadow: 0 8px 16px rgba(0, 0, 0, 0.35);
        }

        body {
            margin: 0; padding: 20px; font-family: 'Nanum Gothic', sans-serif;
            background-color: var(--choco-brown);
            background-image: radial-gradient(var(--dark-choco) 20%, transparent 20%), radial-gradient(var(--dark-choco) 20%, transparent 20%);
            background-position: 0 0, 20px 20px; background-size: 40px 40px; background-attachment: fixed;
            color: #333; padding-bottom: 220px;
        }

        .header { background: var(--banana-yellow); padding: 20px; border-radius: 25px; text-align: center; box-shadow: var(--soft-shadow); margin-bottom: 25px; position: relative; }
        .settings-btn { position: absolute; top: 15px; right: 15px; cursor: pointer; font-size: 20px; }
        .card { background: #fffdf0; padding: 20px; border-radius: 20px; margin-bottom: 20px; box-shadow: var(--soft-shadow); }
        .card h3 { color: var(--choco-brown); margin-top: 0; border-left: 5px solid var(--choco-brown); padding-left: 10px; font-size: 16px; }

        input { width: 100%; padding: 12px; margin: 5px 0; border: 2px solid var(--banana-yellow); border-radius: 12px; box-sizing: border-box; font-size: 16px; }
        
        button.add-btn { width: 100%; padding: 15px; background: var(--accent-yellow); border: none; border-radius: 40px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: var(--soft-shadow); margin-top: 10px; }

        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed #ddd; }
        .type-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 5px; font-weight: bold; }
        .tag-consumable { background: #e8f5e9; color: #2e7d32; } /* 소모품 8% */
        .tag-general { background: #e3f2fd; color: #1565c0; }     /* 일반 10% */

        .total-bar {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--dark-choco);
            color: white; padding: 15px 20px; border-radius: 30px 30px 0 0;
            box-shadow: 0 -8px 24px rgba(0,0,0,0.45); border-top: 5px solid var(--banana-yellow); z-index: 1000;
        }

        .sub-totals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; font-size: 11px; color: #bbb; }
        .main-total { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.1); padding: 10px 15px; border-radius: 15px; }
        .tax-free-banner { background: #fffde7; color: #333; margin-top: 10px; padding: 8px; border-radius: 10px; font-size: 12px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <div class="header">
        <span class="settings-btn" onclick="openSettings()">⚙️</span>
        <h2 style="margin:0">쇼핑 목록 계산기</h2>
        <small>Don Quijote JP 🍌🍫</small>
    </div>

    <div class="card">
        <h3>ITEM INPUT</h3>
        <input type="text" id="name" placeholder="상품명">
        <input type="number" id="prePrice" placeholder="세전 가격 (엔)" inputmode="numeric">
        <input type="number" id="postPrice" placeholder="세후 가격 (엔)" inputmode="numeric">
        <input type="number" id="qty" value="1" placeholder="개수" inputmode="numeric">
        <button class="add-btn" onclick="addItem()">~~ 'u' ~~ 담기</button>
    </div>

    <div class="card">
        <h3>🛒 장바구니</h3>
        <div id="itemList"></div>
        <button onclick="clearCart()" style="background:none; border:none; color:#999; margin-top:15px; cursor:pointer; width:100%;">전체 비우기</button>
    </div>

    <div class="total-bar">
        <div class="sub-totals">
            <div>소모품(8%): <span id="sumConsumable">0</span> ¥</div>
            <div style="text-align:right;">일반(10%): <span id="sumGeneral">0</span> ¥</div>
        </div>
        <div class="main-total">
            <div style="font-size:12px; color:var(--banana-yellow);">최종 합계</div>
            <div id="finalTotal" style="font-size:22px; font-weight:bold; color:var(--accent-yellow);">0 ¥</div>
        </div>
        <div id="msg" class="tax-free-banner">각 카테고리별 5,000엔 이상 면세 가능</div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('chocoCart')) || [];
        let sheetUrl = localStorage.getItem('sheetUrl') || "";

        function openSettings() {
            const url = prompt("구글 Apps Script 배포 URL을 입력하세요:", sheetUrl);
            if (url !== null) { localStorage.setItem('sheetUrl', url); sheetUrl = url; alert("연동 완료!"); }
        }

        async function addItem() {
            const name = document.getElementById('name').value || "상품";
            const pre = Number(document.getElementById('prePrice').value);
            const post = Number(document.getElementById('postPrice').value);
            const qty = Number(document.getElementById('qty').value);

            if (!pre || !post) return alert("세전/세후 가격을 모두 입력하세요!");

            // 세율 계산 및 타입 분류
            const rate = (post - pre) / pre;
            const type = rate > 0.09 ? "일반" : "소모품"; // 9% 기준으로 분류

            const newItem = { name, pre, post, qty, type };
            cart.push(newItem);
            
            if(sheetUrl) { fetch(sheetUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify(newItem) }); }

            saveAndRender();
            document.getElementById('name').value = '';
            document.getElementById('prePrice').value = '';
            document.getElementById('postPrice').value = '';
        }

        function saveAndRender() {
            localStorage.setItem('chocoCart', JSON.stringify(cart));
            render();
        }

        function render() {
            const list = document.getElementById('itemList');
            list.innerHTML = '';
            let sumC = 0; // 소모품 세전 합계
            let sumG = 0; // 일반물품 세전 합계
            let taxC = 0; // 소모품 세후 합계
            let taxG = 0; // 일반물품 세후 합계

            cart.forEach((item, i) => {
                const itemTotalPre = item.pre * item.qty;
                const itemTotalPost = item.post * item.qty;
                
                if(item.type === "소모품") { sumC += itemTotalPre; taxC += itemTotalPost; }
                else { sumG += itemTotalPre; taxG += itemTotalPost; }

                const typeClass = item.type === "소모품" ? "tag-consumable" : "tag-general";

                list.innerHTML += `
                    <div class="item-row">
                        <div>
                            <b>${item.name}</b><span class="type-tag ${typeClass}">${item.type}</span>
                            <br><small>${item.pre}¥ x ${item.qty}</small>
                        </div>
                        <div style="text-align:right;">
                            <b>${itemTotalPost.toLocaleString()}¥</b>
                            <span style="color:#ff4444; margin-left:8px; cursor:pointer;" onclick="remove(${i})">×</span>
                        </div>
                    </div>`;
            });

            // 면세 계산 (각각 5000엔 기준)
            const isCFree = sumC >= 5000;
            const isGFree = sumG >= 5000;

            const finalC = isCFree ? sumC : taxC;
            const finalG = isGFree ? sumG : taxG;

            document.getElementById('sumConsumable').innerText = finalC.toLocaleString();
            document.getElementById('sumGeneral').innerText = finalG.toLocaleString();
            document.getElementById('finalTotal').innerText = (finalC + finalG).toLocaleString() + " ¥";
            
            // 배너 메시지
            if(isCFree && isGFree) document.getElementById('msg').innerText = "🎉 모든 항목 면세 적용 완료!";
            else if(isCFree || isGFree) document.getElementById('msg').innerText = "💡 일부 카테고리 면세 적용 중";
            else document.getElementById('msg').innerText = "5,000엔 이상 시 카테고리별 면세 가능";
        }

        function remove(i) { cart.splice(i, 1); saveAndRender(); }
        function clearCart() { if(confirm("초기화할까요?")) { cart = []; saveAndRender(); } }

        render();
    </script>
</body>
</html>
