<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초코바나나 계산기 🍌</title>
    <style>
        :root {
            --banana-yellow: #fff5a5;
            --choco-brown: #4e342e;
            --dark-choco: #2d1b18;
            --accent-yellow: #ffeb3b;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Nanum Gothic', sans-serif;
            /* 도트 패턴 배경 */
            background-color: var(--choco-brown);
            background-image: radial-gradient(var(--dark-choco) 20%, transparent 20%);
            background-size: 30px 30px; /* 도트 크기 키움 */
            background-attachment: fixed;
            color: #333;
            transition: background-color 0.3s ease;
            padding-bottom: 180px;
        }

        /* 스크롤 시 배경색 변경을 위한 클래스 */
        body.scrolled {
            background-color: var(--dark-choco);
        }

        .header {
            background: var(--banana-yellow);
            padding: 20px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 8px 0px rgba(0,0,0,0.2);
            margin-bottom: 25px;
            position: relative;
        }

        .settings-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            cursor: pointer;
            font-size: 20px;
        }

        .card {
            background: #fffdf0;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .card h3 { color: var(--choco-brown); margin-top: 0; border-left: 5px solid var(--choco-brown); padding-left: 10px; }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid var(--banana-yellow);
            border-radius: 12px;
            box-sizing: border-box;
            background: #fff;
        }

        button.add-btn {
            width: 100%;
            padding: 15px;
            background: var(--accent-yellow);
            border: none;
            border-radius: 40px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 0 #d4c000;
            margin-top: 10px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed #ccc;
        }

        /* 하단 토탈 바 */
        .total-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--dark-choco);
            color: white;
            padding: 20px;
            border-radius: 30px 30px 0 0;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            border-top: 4px solid var(--banana-yellow);
        }

        .total-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: center;
        }

        .price-box {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 15px;
        }

        .tax-free-banner {
            background: #fffde7;
            color: #333;
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <span class="settings-btn" onclick="openSettings()">⚙️</span>
        <h2 style="margin:0">쇼핑 목록 계산기</h2>
        <small>Don Quijote JP</small>
    </div>

    <div class="card">
        <h3>ITEM INPUT</h3>
        <input type="text" id="name" placeholder="상품명">
        <input type="number" id="price" placeholder="세전 가격(엔)" inputmode="numeric">
        <input type="number" id="qty" value="1" placeholder="개수" inputmode="numeric">
        <button class="add-btn" onclick="addItem()">-( ~'u'~)- 담기</button>
    </div>

    <div class="card">
        <h3>🛒 장바구니</h3>
        <div id="itemList"></div>
        <button onclick="clearCart()" style="background:none; border:none; color:#999; margin-top:10px; cursor:pointer;">전체 비우기</button>
    </div>

    <div class="total-bar">
        <div class="total-grid">
            <div class="price-box">
                <div style="font-size:12px; color:#aaa;">세전 합계</div>
                <div id="totalPre" style="font-size:20px; font-weight:bold;">0 ¥</div>
            </div>
            <div class="price-box" style="background: var(--accent-yellow); color: #333;">
                <div style="font-size:12px;">세후 합계</div>
                <div id="totalPost" style="font-size:20px; font-weight:bold;">0 ¥</div>
            </div>
        </div>
        <div id="msg" class="tax-free-banner">5,000엔 이상 면세 가능!</div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('chocoCart')) || [];
        let sheetUrl = localStorage.getItem('sheetUrl') || "";

        // 1. 스크롤 시 배경색 진하게 변경
        window.onscroll = function() {
            if (document.body.scrollTop > 50 || document.documentElement.scrollTop > 50) {
                document.body.classList.add("scrolled");
            } else {
                document.body.classList.remove("scrolled");
            }
        };

        // 2. 구글 시트 주소 설정
        function openSettings() {
            const url = prompt("구글 Apps Script 배포 URL을 입력하세요:", sheetUrl);
            if (url !== null) {
                localStorage.setItem('sheetUrl', url);
                sheetUrl = url;
                alert("연동 주소가 저장되었습니다!");
            }
        }

        async function addItem() {
            const name = document.getElementById('name').value || "상품";
            const price = Number(document.getElementById('price').value);
            const qty = Number(document.getElementById('qty').value);

            if (!price) return alert("가격을 입력하세요!");

            const newItem = { name, price, qty };
            cart.push(newItem);
            
            // 시트 주소가 있으면 전송
            if(sheetUrl) {
                fetch(sheetUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify(newItem) });
            }

            saveAndRender();
            document.getElementById('name').value = '';
            document.getElementById('price').value = '';
        }

        function saveAndRender() {
            localStorage.setItem('chocoCart', JSON.stringify(cart));
            render();
        }

        function render() {
            const list = document.getElementById('itemList');
            list.innerHTML = '';
            let total = 0;

            cart.forEach((item, i) => {
                total += (item.price * item.qty);
                list.innerHTML += `
                    <div class="item-row">
                        <div><b>${item.name}</b><br><small>${item.price}¥ x ${item.qty}</small></div>
                        <div>${(item.price*item.qty).toLocaleString()}¥ <span onclick="remove(${i})" style="color:red; margin-left:10px; cursor:pointer;">×</span></div>
                    </div>`;
            });

            const isFree = total >= 5000;
            document.getElementById('totalPre').innerText = total.toLocaleString() + " ¥";
            document.getElementById('totalPost').innerText = (isFree ? total : Math.floor(total * 1.1)).toLocaleString() + " ¥";
            document.getElementById('msg').innerText = isFree ? "🎉 면세 대상입니다!" : "5,000엔 이상 면세 가능!";
        }

        function remove(i) { cart.splice(i, 1); saveAndRender(); }
        function clearCart() { if(confirm("초기화할까요?")) { cart = []; saveAndRender(); } }

        render();
    </script>
</body>
</html>
