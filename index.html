<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초코바나나 계산기 🍌</title>
    <style>
        :root {
            --banana-yellow: #fff5a5;
            --choco-brown: #4e342e;
            --dark-choco: #2d1b18;
            --accent-yellow: #ffeb3b;
            --soft-shadow: 0 8px 16px rgba(0, 0, 0, 0.35);
        }

        body {
            margin: 0; padding: 20px; font-family: 'Nanum Gothic', sans-serif;
            background-color: var(--choco-brown);
            background-image: radial-gradient(var(--dark-choco) 20%, transparent 20%), radial-gradient(var(--dark-choco) 20%, transparent 20%);
            background-position: 0 0, 20px 20px; background-size: 40px 40px; background-attachment: fixed;
            color: #333; padding-bottom: 240px;
        }

        .header { background: var(--banana-yellow); padding: 20px; border-radius: 25px; text-align: center; box-shadow: var(--soft-shadow); margin-bottom: 25px; position: relative; }
        .settings-btn { position: absolute; top: 15px; right: 15px; cursor: pointer; font-size: 20px; }
        .card { background: #fffdf0; padding: 20px; border-radius: 20px; margin-bottom: 20px; box-shadow: var(--soft-shadow); }
        .card h3 { color: var(--choco-brown); margin-top: 0; border-left: 5px solid var(--choco-brown); padding-left: 10px; font-size: 14px; margin-bottom: 15px; }

        .type-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .type-btn { flex: 1; padding: 12px; border: 2px solid var(--banana-yellow); border-radius: 12px; background: white; cursor: pointer; font-weight: bold; color: #999; transition: 0.2s; font-size: 14px; text-align: center;}
        .type-btn.active { background: var(--accent-yellow); color: var(--choco-brown); border-color: var(--accent-yellow); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }

        input { width: 100%; padding: 14px; margin: 6px 0; border: 2px solid var(--banana-yellow); border-radius: 12px; box-sizing: border-box; font-size: 16px; transition: border-color 0.3s; }
        input:focus { outline: none; border-color: var(--choco-brown); }
        
        button.add-btn { width: 100%; padding: 16px; background: var(--accent-yellow); border: none; border-radius: 40px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: var(--soft-shadow); margin-top: 15px; }

        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px dashed #ddd; }
        .qty-control { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .qty-btn { width: 28px; height: 28px; border-radius: 8px; border: 1px solid #ddd; background: white; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        
        .type-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }
        .tag-consumable { background: #e8f5e9; color: #2e7d32; }
        .tag-general { background: #e3f2fd; color: #1565c0; }

        .total-bar {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--dark-choco);
            color: white; padding: 18px 20px; border-radius: 30px 30px 0 0;
            box-shadow: 0 -8px 24px rgba(0,0,0,0.45); border-top: 5px solid var(--banana-yellow); z-index: 1000;
        }

        .sub-totals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; font-size: 12px; color: #bbb; }
        .main-total { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.08); padding: 12px 18px; border-radius: 18px; }
        .tax-free-banner { background: #fffde7; color: #333; margin-top: 12px; padding: 10px; border-radius: 12px; font-size: 13px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <div class="header">
        <span class="settings-btn" onclick="openSettings()">⚙️</span>
        <h2 style="margin:0">쇼핑 목록 계산기</h2>
        <small>JP 🍌🍫</small>
    </div>

    <div class="card">
        <h3>ITEM INPUT</h3>
        <div id="typeSelectorArea" class="type-selector">
            <div id="btnConsumable" class="type-btn active" onclick="setType('소모품')">소모품 (8%)</div>
            <div id="btnGeneral" class="type-btn" onclick="setType('일반')">일반 (10%)</div>
        </div>
        <input type="text" id="name" placeholder="상품명">
        <input type="number" id="prePrice" placeholder="세전 가격 (엔)" inputmode="numeric" oninput="handleInput('pre')">
        <input type="number" id="postPrice" placeholder="세후 가격 (엔)" inputmode="numeric" oninput="handleInput('post')">
        <input type="number" id="qty" value="1" placeholder="개수" inputmode="numeric">
        <button class="add-btn" onclick="addItem()">~~ 'u' ~~ 담기</button>
    </div>

    <div class="card">
        <h3>🛒 장바구니</h3>
        <div id="itemList"></div>
        <button onclick="clearCart()" style="background:none; border:none; color:#999; margin-top:20px; cursor:pointer; width:100%; font-size:12px;">전체 비우기</button>
    </div>

    <div class="total-bar">
        <div class="sub-totals">
            <div>소모품(8%): <span id="sumConsumable" style="color:white; font-weight:bold;">0</span> ¥</div>
            <div style="text-align:right;">일반(10%): <span id="sumGeneral" style="color:white; font-weight:bold;">0</span> ¥</div>
        </div>
        <div class="main-total">
            <div style="font-size:13px; color:var(--banana-yellow);">최종 결제 금액</div>
            <div id="finalTotal" style="font-size:24px; font-weight:bold; color:var(--accent-yellow);">0 ¥</div>
        </div>
        <div id="msg" class="tax-free-banner">카테고리별 5,000엔 이상 시 면세 가능</div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('chocoCart')) || [];
        let sheetUrl = localStorage.getItem('sheetUrl') || "";
        let currentType = '소모품';

        function setType(type) {
            currentType = type;
            document.getElementById('btnConsumable').classList.toggle('active', type === '소모품');
            document.getElementById('btnGeneral').classList.toggle('active', type === '일반');
            
            // 타입 변경 시, 입력된 값이 하나만 있다면 즉시 재계산
            const preVal = document.getElementById('prePrice').value;
            const postVal = document.getElementById('postPrice').value;
            
            if (preVal && !postVal) handleInput('pre');
            else if (!preVal && postVal) handleInput('post');
            else if (preVal && postVal) handleInput('pre'); // 둘 다 있을 땐 세전 기준 재계산
        }

        function handleInput(mode) {
            const preEl = document.getElementById('prePrice');
            const postEl = document.getElementById('postPrice');
            const selector = document.getElementById('typeSelectorArea');

            // 1. 둘 다 값이 명시적으로 입력된 경우: 자동 판별 모드 활성화 (UI 흐리게)
            if (preEl.value !== "" && postEl.value !== "" && mode === 'manual') {
                selector.style.opacity = "0.3";
                selector.style.pointerEvents = "none";
                return;
            }

            // 2. 하나만 입력 중이거나 타입 버튼을 눌러 계산하는 경우
            selector.style.opacity = "1";
            selector.style.pointerEvents = "auto";
            
            const rate = currentType === '소모품' ? 0.08 : 0.10;
            
            if (mode === 'pre' && preEl.value !== "") {
                // 세후 = 세전 * 1.08 (소수점 버림)
                postEl.value = Math.floor(Number(preEl.value) * (1 + rate));
            } else if (mode === 'post' && postEl.value !== "") {
                // 세전 = 세후 / 1.08 (소수점 올림 - 일본 드럭스토어 역산 기준)
                preEl.value = Math.ceil(Number(postEl.value) / (1 + rate));
            }
        }

        // 수동 입력 감지를 위해 이벤트 리스너 추가 (둘 다 입력 여부 체크용)
        document.getElementById('prePrice').addEventListener('blur', () => handleInput('manual'));
        document.getElementById('postPrice').addEventListener('blur', () => handleInput('manual'));

        async function addItem() {
            const preVal = document.getElementById('prePrice').value;
            const postVal = document.getElementById('postPrice').value;
            const name = document.getElementById('name').value || "상품";
            const qty = Number(document.getElementById('qty').value);

            if (!preVal || !postVal) return alert("가격을 입력해주세요!");

            const pre = Number(preVal);
            const post = Number(postVal);

            // 최종 타입 결정: 둘 다 수동 입력했다면 세율 계산으로 판별
            let finalType = currentType;
            const selector = document.getElementById('typeSelectorArea');
            if (selector.style.opacity === "0.3") {
                const calculatedRate = (post - pre) / pre;
                finalType = calculatedRate > 0.09 ? "일반" : "소모품";
            }

            const newItem = { name, pre, post, qty, type: finalType };
            cart.push(newItem);
            
            if(sheetUrl) { fetch(sheetUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify(newItem) }); }

            saveAndRender();
            // 입력창 초기화
            document.getElementById('name').value = '';
            document.getElementById('prePrice').value = '';
            document.getElementById('postPrice').value = '';
            selector.style.opacity = "1";
            selector.style.pointerEvents = "auto";
        }

        function changeQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty < 1) cart[index].qty = 1;
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('chocoCart', JSON.stringify(cart));
            render();
        }

        function render() {
            const list = document.getElementById('itemList');
            list.innerHTML = '';
            let sumC = 0, sumG = 0, taxC = 0, taxG = 0;

            cart.forEach((item, i) => {
                const itemTotalPre = item.pre * item.qty;
                const itemTotalPost = item.post * item.qty;
                if(item.type === "소모품") { sumC += itemTotalPre; taxC += itemTotalPost; }
                else { sumG += itemTotalPre; taxG += itemTotalPost; }

                list.innerHTML += `
                    <div class="item-row">
                        <div>
                            <b>${item.name}</b><span class="type-tag ${item.type === "소모품" ? "tag-consumable" : "tag-general"}">${item.type}</span>
                            <div class="qty-control">
                                <button class="qty-btn" onclick="changeQty(${i}, -1)">-</button>
                                <span style="font-size:14px; font-weight:bold;">${item.qty}</span>
                                <button class="qty-btn" onclick="changeQty(${i}, 1)">+</button>
                            </div>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-size:18px; font-weight:bold;">${itemTotalPost.toLocaleString()}¥</div>
                            <div style="color:#ff4444; font-size:12px; margin-top:8px; cursor:pointer;" onclick="remove(${i})">삭제하기</div>
                        </div>
                    </div>`;
            });

            const isCFree = sumC >= 5000, isGFree = sumG >= 5000;
            const finalC = isCFree ? sumC : taxC, finalG = isGFree ? sumG : taxG;

            document.getElementById('sumConsumable').innerText = finalC.toLocaleString();
            document.getElementById('sumGeneral').innerText = finalG.toLocaleString();
            document.getElementById('finalTotal').innerText = (finalC + finalG).toLocaleString() + " ¥";
            
            if(isCFree && isGFree) document.getElementById('msg').innerText = "🎉 전 품목 면세 적용 완료!";
            else if(isCFree || isGFree) document.getElementById('msg').innerText = "💡 일부 면세 적용 (5,000엔↑ 항목)";
            else document.getElementById('msg').innerText = "카테고리별 5,000엔 이상 시 면세 가능";
        }

        function remove(i) { cart.splice(i, 1); saveAndRender(); }
        function clearCart() { if(confirm("모든 목록을 삭제할까요?")) { cart = []; saveAndRender(); } }
        function openSettings() {
            const url = prompt("구글 Apps Script 배포 URL:", sheetUrl);
            if (url !== null) { localStorage.setItem('sheetUrl', url); sheetUrl = url; }
        }

        render();
    </script>
</body>
</html>
