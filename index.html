<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초코바나나 계산기 🍌</title>
    <style>
        :root {
            --banana-yellow: #fff5a5;
            --choco-brown: #4e342e;
            --dark-choco: #2d1b18;
            --accent-yellow: #ffeb3b;
            /* 투명도 35%의 부드러운 그림자 설정 */
            --soft-shadow: 0 8px 16px rgba(0, 0, 0, 0.35);
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Nanum Gothic', sans-serif;
            background-color: var(--choco-brown);
            /* 45도 각도 정렬 도트 패턴 */
            background-image: 
                radial-gradient(var(--dark-choco) 20%, transparent 20%),
                radial-gradient(var(--dark-choco) 20%, transparent 20%);
            background-position: 0 0, 20px 20px;
            background-size: 40px 40px;
            background-attachment: fixed;
            color: #333;
            padding-bottom: 180px;
        }

        .header {
            background: var(--banana-yellow);
            padding: 20px;
            border-radius: 25px;
            text-align: center;
            box-shadow: var(--soft-shadow);
            margin-bottom: 25px;
            position: relative;
        }

        .settings-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            cursor: pointer;
            font-size: 20px;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
        }

        .card {
            background: #fffdf0;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: var(--soft-shadow);
        }

        .card h3 { 
            color: var(--choco-brown); 
            margin-top: 0; 
            border-left: 5px solid var(--choco-brown); 
            padding-left: 10px; 
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid var(--banana-yellow);
            border-radius: 12px;
            box-sizing: border-box;
            background: #fff;
            font-size: 16px;
        }

        /* 버튼 및 섀도우 적용 */
        button.add-btn {
            width: 100%;
            padding: 15px;
            background: var(--accent-yellow);
            border: none;
            border-radius: 40px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-shadow: var(--soft-shadow);
            transition: transform 0.1s;
        }

        button.add-btn:active {
            transform: translateY(2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dashed #ddd;
        }

        .delete-btn {
            color: #ff4444;
            cursor: pointer;
            padding: 5px 10px;
            font-weight: bold;
        }

        /* 하단 토탈 바 */
        .total-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--dark-choco);
            color: white;
            padding: 20px;
            border-radius: 30px 30px 0 0;
            box-shadow: 0 -8px 24px rgba(0,0,0,0.45);
            border-top: 5px solid var(--banana-yellow);
            z-index: 1000;
        }

        .total-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: center;
        }

        .price-box {
            background: rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 15px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .tax-free-banner {
            background: #fffde7;
            color: #333;
            margin-top: 15px;
            padding: 12px;
            border-radius: 15px;
            font-weight: bold;
            text-align: center;
            box-shadow: var(--soft-shadow);
        }
    </style>
</head>
<body>

    <div class="header">
        <span class="settings-btn" onclick="openSettings()">⚙️</span>
        <h2 style="margin:0">쇼핑 목록 계산기</h2>
        <small>Don Quijote JP 🍌🍫</small>
    </div>

    <div class="card">
        <h3>ITEM INPUT</h3>
        <input type="text" id="name" placeholder="상품명">
        <input type="number" id="price" placeholder="세전 가격(엔)" inputmode="numeric">
        <input type="number" id="qty" value="1" placeholder="개수" inputmode="numeric">
        <button class="add-btn" onclick="addItem()">~~ 'u' ~~ 담기</button>
    </div>

    <div class="card">
        <h3>🛒 장바구니</h3>
        <div id="itemList"></div>
        <button onclick="clearCart()" style="background:none; border:none; color:#999; margin-top:15px; cursor:pointer; width:100%; text-align:center;">전체 비우기</button>
    </div>

    <div class="total-bar">
        <div class="total-grid">
            <div class="price-box">
                <div style="font-size:12px; color:#bbb; margin-bottom:4px;">세전 합계</div>
                <div id="totalPre" style="font-size:20px; font-weight:bold;">0 ¥</div>
            </div>
            <div class="price-box" style="background: var(--banana-yellow); color: #4e342e;">
                <div style="font-size:12px; font-weight:bold; margin-bottom:4px;">세후 합계</div>
                <div id="totalPost" style="font-size:20px; font-weight:bold;">0 ¥</div>
            </div>
        </div>
        <div id="msg" class="tax-free-banner">5,000엔 이상 면세 가능!</div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('chocoCart')) || [];
        let sheetUrl = localStorage.getItem('sheetUrl') || "";

        function openSettings() {
            const url = prompt("구글 Apps Script 배포 URL을 입력하세요:", sheetUrl);
            if (url !== null) {
                localStorage.setItem('sheetUrl', url);
                sheetUrl = url;
                alert("연동 주소가 저장되었습니다!");
            }
        }

        async function addItem() {
            const name = document.getElementById('name').value || "상품";
            const price = Number(document.getElementById('price').value);
            const qty = Number(document.getElementById('qty').value);

            if (!price) return alert("가격을 입력하세요!");

            const newItem = { name, price, qty };
            cart.push(newItem);
            
            if(sheetUrl) {
                fetch(sheetUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify(newItem) });
            }

            saveAndRender();
            document.getElementById('name').value = '';
            document.getElementById('price').value = '';
        }

        function saveAndRender() {
            localStorage.setItem('chocoCart', JSON.stringify(cart));
            render();
        }

        function render() {
            const list = document.getElementById('itemList');
            list.innerHTML = '';
            let total = 0;

            cart.forEach((item, i) => {
                total += (item.price * item.qty);
                list.innerHTML += `
                    <div class="item-row">
                        <div><b>${item.name}</b><br><small>${item.price}¥ x ${item.qty}</small></div>
                        <div style="text-align:right;">
                            <b>${(item.price*item.qty).toLocaleString()}¥</b>
                            <span class="delete-btn" onclick="remove(${i})">×</span>
                        </div>
                    </div>`;
            });

            const isFree = total >= 5000;
            document.getElementById('totalPre').innerText = total.toLocaleString() + " ¥";
            document.getElementById('totalPost').innerText = (isFree ? total : Math.floor(total * 1.1)).toLocaleString() + " ¥";
            document.getElementById('msg').innerText = isFree ? "🎉 면세 대상입니다!" : "5,000엔 이상 면세 가능!";
            document.getElementById('msg').style.background = isFree ? "#e8f5e9" : "#fffde7";
        }

        function remove(i) { cart.splice(i, 1); saveAndRender(); }
        function clearCart() { if(confirm("초기화할까요?")) { cart = []; saveAndRender(); } }

        render();
    </script>
</body>
</html>
